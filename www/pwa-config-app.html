<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4a90e2">
    <title>Device Config</title>
    <link rel="manifest" href="manifest.json">
    <style>
        /* Previous styles remain the same */
        .schedule-group {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 15px 0;
            border-radius: 4px;
            background-color: #f8f9fa;
        }
        .days-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }
        .day-checkbox {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .time-group {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
        }
        .time-input {
            width: 70px !important;
        }
        .remove-schedule {
            background-color: #dc3545;
            margin-top: 15px;
        }
        .remove-schedule:hover {
            background-color: #c82333;
        }
        .channels-select {
            min-height: 100px;
        }
        /* Previous styles here */
    </style>
</head>
<body>
    <!-- Previous HTML content remains the same until the second collapsible section -->
    <form id="configForm">
        <!-- Previous form fields remain the same -->
        
        <button type="button" class="collapsible">Channel Settings</button>
        <div class="channel-content">
            <!-- Previous channel settings content -->
        </div>

        <button type="button" class="collapsible">Schedule Settings</button>
        <div class="channel-content">
            <button type="button" id="addSchedule" class="button">Add Schedule</button>
            <div id="scheduleContainer"></div>
        </div>

        <button type="submit">Save</button>
    </form>
    <div id="status" class="status"></div>

    <script>
        // Schedule class definition
        class Schedule {
            constructor() {
                this.id = Date.now(); // Unique identifier
                this.days = [];
                this.startHour = 0;
                this.startMinute = 0;
                this.endHour = 0;
                this.endMinute = 0;
                this.startDuty = 0;
                this.maxDuty = 0;
                this.endDuty = 0;
                this.startInterval = 0;
                this.endInterval = 0;
                this.channels = [];
            }
        }

        // Global schedules array
        let schedules = [];

        // Function to create schedule HTML
        function createScheduleElement(schedule) {
            const div = document.createElement('div');
            div.className = 'schedule-group';
            div.dataset.scheduleId = schedule.id;

            const daysHtml = `
                <div class="form-group">
                    <label>Days:</label>
                    <div class="days-group">
                        ${['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday']
                            .map((day, index) => `
                                <div class="day-checkbox">
                                    <input type="checkbox" id="day${schedule.id}_${index}" 
                                        ${schedule.days.includes(day) ? 'checked' : ''}>
                                    <label for="day${schedule.id}_${index}">${day}</label>
                                </div>
                            `).join('')}
                    </div>
                </div>`;

            const timeHtml = `
                <div class="form-group">
                    <label>Start Time:</label>
                    <div class="time-group">
                        <input type="number" class="time-input" min="0" max="23" value="${schedule.startHour}" placeholder="Hour">
                        <span>:</span>
                        <input type="number" class="time-input" min="0" max="59" value="${schedule.startMinute}" placeholder="Min">
                    </div>
                </div>
                <div class="form-group">
                    <label>End Time:</label>
                    <div class="time-group">
                        <input type="number" class="time-input" min="0" max="23" value="${schedule.endHour}" placeholder="Hour">
                        <span>:</span>
                        <input type="number" class="time-input" min="0" max="59" value="${schedule.endMinute}" placeholder="Min">
                    </div>
                </div>`;

            const dutyHtml = `
                <div class="form-group">
                    <label>Start Duty (%):</label>
                    <input type="number" min="0" max="100" value="${schedule.startDuty}">
                </div>
                <div class="form-group">
                    <label>Max Duty (%):</label>
                    <input type="number" min="0" max="100" value="${schedule.maxDuty}">
                </div>
                <div class="form-group">
                    <label>End Duty (%):</label>
                    <input type="number" min="0" max="100" value="${schedule.endDuty}">
                </div>`;

            const intervalHtml = `
                <div class="form-group">
                    <label>Start Interval (minutes):</label>
                    <input type="number" min="0" value="${schedule.startInterval}">
                </div>
                <div class="form-group">
                    <label>End Interval (minutes):</label>
                    <input type="number" min="0" value="${schedule.endInterval}">
                </div>`;

            const channelsHtml = `
                <div class="form-group">
                    <label>Channels:</label>
                    <select multiple class="channels-select">
                        ${Array.from({length: 8}, (_, i) => {
                            const channelName = document.getElementById(`channelName${i+1}`).value || `Channel ${i+1}`;
                            return `<option value="${i+1}" ${schedule.channels.includes(i+1) ? 'selected' : ''}>
                                ${channelName}
                            </option>`;
                        }).join('')}
                    </select>
                </div>`;

            div.innerHTML = `
                ${daysHtml}
                ${timeHtml}
                ${dutyHtml}
                ${intervalHtml}
                ${channelsHtml}
                <button type="button" class="button remove-schedule">Remove Schedule</button>
            `;

            // Add event listener for remove button
            div.querySelector('.remove-schedule').addEventListener('click', () => {
                schedules = schedules.filter(s => s.id !== schedule.id);
                div.remove();
                saveToLocalStorage();
            });

            // Add event listeners for all inputs to update schedule object
            div.addEventListener('change', (e) => {
                const scheduleIndex = schedules.findIndex(s => s.id === schedule.id);
                if (scheduleIndex === -1) return;

                // Update days
                if (e.target.type === 'checkbox') {
                    const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
                    schedules[scheduleIndex].days = Array.from(div.querySelectorAll('input[type="checkbox"]'))
                        .map((cb, i) => cb.checked ? days[i] : null)
                        .filter(Boolean);
                }

                // Update times
                const timeInputs = div.querySelectorAll('.time-input');
                schedules[scheduleIndex].startHour = parseInt(timeInputs[0].value) || 0;
                schedules[scheduleIndex].startMinute = parseInt(timeInputs[1].value) || 0;
                schedules[scheduleIndex].endHour = parseInt(timeInputs[2].value) || 0;
                schedules[scheduleIndex].endMinute = parseInt(timeInputs[3].value) || 0;

                // Update duty cycles
                const dutyInputs = div.querySelectorAll('input[type="number"]');
                schedules[scheduleIndex].startDuty = parseInt(dutyInputs[4].value) || 0;
                schedules[scheduleIndex].maxDuty = parseInt(dutyInputs[5].value) || 0;
                schedules[scheduleIndex].endDuty = parseInt(dutyInputs[6].value) || 0;

                // Update intervals
                schedules[scheduleIndex].startInterval = parseInt(dutyInputs[7].value) || 0;
                schedules[scheduleIndex].endInterval = parseInt(dutyInputs[8].value) || 0;

                // Update channels
                const channelsSelect = div.querySelector('.channels-select');
                schedules[scheduleIndex].channels = Array.from(channelsSelect.selectedOptions)
                    .map(option => parseInt(option.value));

                saveToLocalStorage();
            });

            return div;
        }

        // Add new schedule
        document.getElementById('addSchedule').addEventListener('click', () => {
            const schedule = new Schedule();
            schedules.push(schedule);
            document.getElementById('scheduleContainer').appendChild(createScheduleElement(schedule));
            saveToLocalStorage();
        });

        // Modified saveToLocalStorage function
        function saveToLocalStorage() {
            const formData = {
                deviceIP: document.getElementById('deviceIP').value,
                time: document.getElementById('time').value,
                wifiName: document.getElementById('wifiName').value,
                wifiPassword: document.getElementById('wifiPassword').value,
                schedules: schedules
            };

            // Add channel names
            for (let i = 1; i <= 8; i++) {
                const channelId = `channelName${i}`;
                formData[channelId] = document.getElementById(channelId).value;
            }

            localStorage.setItem('deviceConfig', JSON.stringify(formData));
        }

        // Modified load from localStorage
        document.addEventListener('DOMContentLoaded', () => {
            const savedData = JSON.parse(localStorage.getItem('deviceConfig') || '{}');
            
            // Load previous fields
            if (savedData.deviceIP) document.getElementById('deviceIP').value = savedData.deviceIP;
            if (savedData.time) document.getElementById('time').value = savedData.time;
            if (savedData.wifiName) document.getElementById('wifiName').value = savedData.wifiName;
            if (savedData.wifiPassword) document.getElementById('wifiPassword').value = savedData.wifiPassword;
            
            // Load channel names
            for (let i = 1; i <= 8; i++) {
                const channelId = `channelName${i}`;
                if (savedData[channelId]) {
                    document.getElementById(channelId).value = savedData[channelId];
                }
            }

            // Load schedules
            if (savedData.schedules) {
                schedules = savedData.schedules;
                schedules.forEach(schedule => {
                    document.getElementById('scheduleContainer').appendChild(createScheduleElement(schedule));
                });
            }
        });

        // Modified form submission
        document.getElementById('configForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                deviceIP: document.getElementById('deviceIP').value,
                time: document.getElementById('time').value,
                wifiName: document.getElementById('wifiName').value,
                wifiPassword: document.getElementById('wifiPassword').value,
                schedules: schedules
            };

            // Add channel names
            for (let i = 1; i <= 8; i++) {
                const channelId = `channelName${i}`;
                formData[channelId] = document.getElementById(channelId).value;
            }

            // Save to localStorage
            localStorage.setItem('deviceConfig', JSON.stringify(formData));

            const statusDiv = document.getElementById('status');
            
            try {
                const response = await fetch(`http://${formData.deviceIP}/store`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    statusDiv.textContent = 'Configuration saved successfully!';
                    statusDiv.className = 'status success';
                } else {
                    throw new Error('Failed to save configuration');
                }
            } catch (error) {
                statusDiv.textContent = 'Error saving configuration. Data saved locally.';
                statusDiv.className = 'status error';
            }
            statusDiv.style.display = 'block';
        });

        // Previous collapsible functionality remains the same
    </script>
</body>
</html>
