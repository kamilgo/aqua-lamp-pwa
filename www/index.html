<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4a90e2">
    <title>Konfiguracja lampy</title>
    <link rel="manifest" href="manifest.json">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        [x-cloak] { display: none !important; }

        /* Custom scrollbar for better UX */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #4a90e2;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #357abd;
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen" x-data="appData()" x-cloak>

    <!-- Fixed Header -->
    <header class="fixed top-0 left-0 right-0 bg-white shadow-md z-50">
        <div class="max-w-4xl mx-auto px-4 py-4">
            <div class="flex justify-between items-center mb-3">
                <h1 class="text-2xl font-bold text-gray-800" x-text="t('Device Configuration')"></h1>
                <button
                    @click="toggleLanguage()"
                    class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors font-semibold"
                    x-text="currentLang === 'en' ? 'PL' : 'EN'">
                </button>
            </div>

            <!-- Tab Navigation -->
            <nav class="flex space-x-2 border-b border-gray-200">
                <button
                    @click="activeTab = 'control'"
                    :class="activeTab === 'control' ? 'border-b-2 border-blue-500 text-blue-600' : 'text-gray-600 hover:text-blue-500'"
                    class="px-4 py-2 font-medium transition-colors"
                    x-text="t('Control')">
                </button>
                <button
                    @click="activeTab = 'schedules'"
                    :class="activeTab === 'schedules' ? 'border-b-2 border-blue-500 text-blue-600' : 'text-gray-600 hover:text-blue-500'"
                    class="px-4 py-2 font-medium transition-colors"
                    x-text="t('Schedules')">
                </button>
                <button
                    @click="activeTab = 'settings'"
                    :class="activeTab === 'settings' ? 'border-b-2 border-blue-500 text-blue-600' : 'text-gray-600 hover:text-blue-500'"
                    class="px-4 py-2 font-medium transition-colors"
                    x-text="t('Settings')">
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Content (with padding for fixed header) -->
    <main class="pt-32 pb-8 max-w-4xl mx-auto px-4">

        <!-- Status Message -->
        <div
            x-show="status.show"
            @click="status.show = false"
            :class="status.type === 'success' ? 'bg-green-100 text-green-800 border-green-300' : 'bg-red-100 text-red-800 border-red-300'"
            class="mb-4 p-4 rounded-lg border cursor-pointer transition-opacity"
            x-transition
            x-text="status.message">
        </div>

        <!-- TAB 1: CONTROL -->
        <div x-show="activeTab === 'control'" x-transition class="space-y-6">

            <!-- Connection Status Card -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-semibold text-gray-800 mb-4" x-text="t('Connection Status')"></h2>

                <div class="flex items-center justify-between mb-4">
                    <div>
                        <span class="text-gray-600" x-text="t('Device IP:')"></span>
                        <span class="font-mono font-semibold ml-2" x-text="config.deviceIP || 'Not set'"></span>
                    </div>
                    <button
                        @click="checkConnection()"
                        class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors"
                        x-text="t('Check connection')">
                    </button>
                </div>

                <div class="flex items-center space-x-2">
                    <div
                        :class="connectionStatus === 'connected' ? 'bg-green-500' : connectionStatus === 'disconnected' ? 'bg-red-500' : 'bg-gray-400'"
                        class="w-3 h-3 rounded-full">
                    </div>
                    <span class="text-sm text-gray-600" x-text="connectionStatus === 'connected' ? t('Connected') : connectionStatus === 'disconnected' ? t('Disconnected') : t('Unknown')"></span>
                </div>
            </div>

            <!-- Channel Controls Card -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-semibold text-gray-800 mb-4" x-text="t('Channel Controls')"></h2>

                <div class="space-y-4">
                    <template x-for="channel in 8" :key="channel">
                        <div class="border border-gray-200 rounded-lg p-4 hover:border-blue-300 transition-colors">
                            <div class="flex items-center justify-between mb-3">
                                <div class="flex-1">
                                    <h3 class="font-semibold text-gray-800" x-text="getChannelName(channel)"></h3>
                                    <p class="text-sm text-gray-500" x-text="t('Channel') + ' ' + channel"></p>
                                </div>
                                <label class="relative inline-flex items-center cursor-pointer">
                                    <input
                                        type="checkbox"
                                        class="sr-only peer"
                                        :checked="channels[channel - 1].enabled"
                                        @change="toggleChannel(channel)">
                                    <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                                </label>
                            </div>

                            <!-- Controls: decrement button, slider, increment button, numeric input -->
                            <div class="flex items-center space-x-3" x-show="channels[channel - 1].enabled">
                                <!-- Decrement: immediate change + hold-to-repeat; send to API on release -->
                                <button
                                    type="button"
                                    @mousedown.prevent="(function(){ const ch = channels[channel-1]; ch.pwm = Math.max(0, Number(ch.pwm) - 1); ch._hold = { timeout: setTimeout(()=>{ ch._hold.interval = setInterval(()=>{ ch.pwm = Math.max(0, Number(ch.pwm) - 1) }, 80) }, 350) }; })()"
                                    @touchstart.prevent="(function(){ const ch = channels[channel-1]; ch.pwm = Math.max(0, Number(ch.pwm) - 1); ch._hold = { timeout: setTimeout(()=>{ ch._hold.interval = setInterval(()=>{ ch.pwm = Math.max(0, Number(ch.pwm) - 1) }, 80) }, 350) }; })()"
                                    @mouseup="(function(){ const ch = channels[channel-1]; if(ch._hold){ if(ch._hold.timeout) clearTimeout(ch._hold.timeout); if(ch._hold.interval) clearInterval(ch._hold.interval); ch._hold = null; } updatePWM(channel, ch.pwm); })()"
                                    @mouseleave="(function(){ const ch = channels[channel-1]; if(ch._hold){ if(ch._hold.timeout) clearTimeout(ch._hold.timeout); if(ch._hold.interval) clearInterval(ch._hold.interval); ch._hold = null; updatePWM(channel, ch.pwm); } })()"
                                    @touchend="(function(){ const ch = channels[channel-1]; if(ch._hold){ if(ch._hold.timeout) clearTimeout(ch._hold.timeout); if(ch._hold.interval) clearInterval(ch._hold.interval); ch._hold = null; } updatePWM(channel, ch.pwm); })()"
                                    @touchcancel="(function(){ const ch = channels[channel-1]; if(ch._hold){ if(ch._hold.timeout) clearTimeout(ch._hold.timeout); if(ch._hold.interval) clearInterval(ch._hold.interval); ch._hold = null; } updatePWM(channel, ch.pwm); })()"
                                    class="px-3 py-1 bg-gray-100 text-gray-700 rounded-md hover:bg-gray-200">
                                    -
                                </button>

                                <!-- Slider -->
                                <input
                                    type="range"
                                    min="0"
                                    max="100"
                                    :value="channels[channel - 1].pwm"
                                    @input="channels[channel - 1].pwm = $event.target.valueAsNumber"
                                    @change="updatePWM(channel, channels[channel - 1].pwm);"
                                    class="flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600">

                                <!-- Increment: immediate change + hold-to-repeat; send to API on release -->
                                <button
                                    type="button"
                                    @mousedown.prevent="(function(){ const ch = channels[channel-1]; ch.pwm = Math.min(100, Number(ch.pwm) + 1); ch._hold = { timeout: setTimeout(()=>{ ch._hold.interval = setInterval(()=>{ ch.pwm = Math.min(100, Number(ch.pwm) + 1) }, 80) }, 350) }; })()"
                                    @touchstart.prevent="(function(){ const ch = channels[channel-1]; ch.pwm = Math.min(100, Number(ch.pwm) + 1); ch._hold = { timeout: setTimeout(()=>{ ch._hold.interval = setInterval(()=>{ ch.pwm = Math.min(100, Number(ch.pwm) + 1) }, 80) }, 350) }; })()"
                                    @mouseup="(function(){ const ch = channels[channel-1]; if(ch._hold){ if(ch._hold.timeout) clearTimeout(ch._hold.timeout); if(ch._hold.interval) clearInterval(ch._hold.interval); ch._hold = null; } updatePWM(channel, ch.pwm); })()"
                                    @mouseleave="(function(){ const ch = channels[channel-1]; if(ch._hold){ if(ch._hold.timeout) clearTimeout(ch._hold.timeout); if(ch._hold.interval) clearInterval(ch._hold.interval); ch._hold = null; updatePWM(channel, ch.pwm); } })()"
                                    @touchend="(function(){ const ch = channels[channel-1]; if(ch._hold){ if(ch._hold.timeout) clearTimeout(ch._hold.timeout); if(ch._hold.interval) clearInterval(ch._hold.interval); ch._hold = null; } updatePWM(channel, ch.pwm) })()"
                                    @touchcancel="(function(){ const ch = channels[channel-1]; if(ch._hold){ if(ch._hold.timeout) clearTimeout(ch._hold.timeout); if(ch._hold.interval) clearInterval(ch._hold.interval); ch._hold = null; } updatePWM(channel, ch.pwm); })()"
                                    class="px-3 py-1 bg-gray-100 text-gray-700 rounded-md hover:bg-gray-200">
                                    +
                                </button>

                                <!-- Manual numeric edit (single editable field with '%' suffix) -->
                                <div class="relative w-20">
                                    <input
                                        type="number"
                                        min="0"
                                        max="100"
                                        x-model.number="channels[channel - 1].pwm"
                                        @change="channels[channel - 1].pwm = Math.min(100, Math.max(0, Number(channels[channel - 1].pwm || 0))); updatePWM(channel, channels[channel - 1].pwm);"
                                        class="w-full pr-6 px-3 py-1 border border-gray-300 rounded-lg text-right"
                                        aria-label="Channel PWM percentage">
                                    <span class="absolute top-1/2 right-2 -translate-y-1/2 text-sm text-gray-700">%</span>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <button
                    @click="disableAllChannels()"
                    class="mt-6 w-full px-4 py-3 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors font-semibold"
                    x-text="t('Disable All Channels')">
                </button>
            </div>
        </div>

        <!-- TAB 2: SCHEDULES -->
        <div x-show="activeTab === 'schedules'" x-transition class="space-y-6">

            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-semibold text-gray-800" x-text="t('Schedule Management')"></h2>
                    <button
                        @click="addSchedule()"
                        class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors flex items-center space-x-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                        </svg>
                        <span x-text="t('Add Schedule')"></span>
                    </button>
                </div>

                <div class="space-y-4">
                    <template x-for="(schedule, index) in schedules" :key="schedule.id">
                        <div class="border border-gray-200 rounded-lg p-6 hover:border-blue-300 transition-colors">

                            <!-- Schedule Header -->
                            <div class="flex justify-between items-start mb-4">
                                <h3 class="text-lg font-semibold text-gray-800" x-text="t('Schedule') + ' #' + (index + 1)"></h3>
                                <button
                                    @click="removeSchedule(schedule.id)"
                                    class="text-red-500 hover:text-red-700 transition-colors">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                    </svg>
                                </button>
                            </div>

                            <!-- Days Selection -->
                            <div class="mb-4">
                                <label class="block text-sm font-medium text-gray-700 mb-2" x-text="t('Days:')"></label>
                                <div class="flex flex-wrap gap-2">
                                    <template x-for="(day, dayIndex) in ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday']" :key="dayIndex">
                                        <label class="flex items-center space-x-2 bg-gray-50 px-3 py-2 rounded-lg cursor-pointer hover:bg-blue-50 transition-colors">
                                            <input
                                                type="checkbox"
                                                :checked="schedule.days.includes(dayIndex + 1)"
                                                @change="toggleScheduleDay(schedule.id, dayIndex + 1)"
                                                class="rounded text-blue-600 focus:ring-blue-500">
                                            <span class="text-sm" x-text="t(day)"></span>
                                        </label>
                                    </template>
                                </div>
                            </div>

                            <!-- Time Settings -->
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2" x-text="t('Start Time:')"></label>
                                    <div class="flex items-center space-x-2">
                                        <input
                                            type="number"
                                            min="0"
                                            max="23"
                                            x-model="schedule.startHour"
                                            @change="saveToLocalStorage()"
                                            class="w-20 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                        <span class="text-gray-600">:</span>
                                        <input
                                            type="number"
                                            min="0"
                                            max="59"
                                            x-model="schedule.startMinute"
                                            @change="saveToLocalStorage()"
                                            class="w-20 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2" x-text="t('End Time:')"></label>
                                    <div class="flex items-center space-x-2">
                                        <input
                                            type="number"
                                            min="0"
                                            max="23"
                                            x-model="schedule.endHour"
                                            @change="saveToLocalStorage()"
                                            class="w-20 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                        <span class="text-gray-600">:</span>
                                        <input
                                            type="number"
                                            min="0"
                                            max="59"
                                            x-model="schedule.endMinute"
                                            @change="saveToLocalStorage()"
                                            class="w-20 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                    </div>
                                </div>
                            </div>

                            <!-- Duty Cycle Settings -->
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2" x-text="t('Start Duty (%):')"></label>
                                    <input
                                        type="number"
                                        min="0"
                                        max="100"
                                        x-model="schedule.startDuty"
                                        @change="saveToLocalStorage()"
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2" x-text="t('Max Duty (%):')"></label>
                                    <input
                                        type="number"
                                        min="0"
                                        max="100"
                                        x-model="schedule.maxDuty"
                                        @change="saveToLocalStorage()"
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2" x-text="t('End Duty (%):')"></label>
                                    <input
                                        type="number"
                                        min="0"
                                        max="100"
                                        x-model="schedule.endDuty"
                                        @change="saveToLocalStorage()"
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                </div>
                            </div>

                            <!-- Interval Settings -->
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2" x-text="t('Start Interval (minutes):')"></label>
                                    <input
                                        type="number"
                                        min="0"
                                        x-model="schedule.startInterval"
                                        @change="saveToLocalStorage()"
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2" x-text="t('End Interval (minutes):')"></label>
                                    <input
                                        type="number"
                                        min="0"
                                        x-model="schedule.endInterval"
                                        @change="saveToLocalStorage()"
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                </div>
                            </div>

                            <!-- Channel Selection -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2" x-text="t('Channels:')"></label>
                                <div class="flex flex-wrap gap-2">
                                    <template x-for="ch in 8" :key="ch">
                                        <label class="flex items-center space-x-2 bg-gray-50 px-3 py-2 rounded-lg cursor-pointer hover:bg-blue-50 transition-colors">
                                            <input
                                                type="checkbox"
                                                :checked="schedule.channels.includes(ch)"
                                                @change="toggleScheduleChannel(schedule.id, ch)"
                                                class="rounded text-blue-600 focus:ring-blue-500">
                                            <span class="text-sm" x-text="getChannelName(ch)"></span>
                                        </label>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- Empty State -->
                    <div x-show="schedules.length === 0" class="text-center py-12 text-gray-500">
                        <svg class="w-16 h-16 mx-auto mb-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                        <p class="text-lg" x-text="t('No schedules yet. Click Add Schedule to create one.')"></p>
                    </div>
                </div>

                <!-- Save Button -->
                <button
                    @click="saveConfiguration()"
                    class="mt-6 w-full px-4 py-3 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors font-semibold"
                    x-text="t('Save Configuration to Device')">
                </button>
            </div>
        </div>

        <!-- TAB 3: SETTINGS -->
        <div x-show="activeTab === 'settings'" x-transition class="space-y-6">

            <!-- Device Settings Card -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-semibold text-gray-800 mb-4" x-text="t('Device Settings')"></h2>

                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2" x-text="t('Device IP:')"></label>
                        <input
                            type="text"
                            x-model="config.deviceIP"
                            @change="saveToLocalStorage()"
                            pattern="^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$"
                            placeholder="192.168.1.100"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>

                    <div class="flex items-center space-x-3 bg-gray-50 p-4 rounded-lg">
                        <input
                            type="checkbox"
                            id="syncTime"
                            x-model="config.time"
                            @change="saveToLocalStorage()"
                            class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500">
                        <label for="syncTime" class="text-sm font-medium text-gray-700" x-text="t('Synchronize with your local time?')"></label>
                    </div>
                </div>
            </div>

            <!-- WiFi Settings Card -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-semibold text-gray-800 mb-4" x-text="t('WiFi Configuration')"></h2>

                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2" x-text="t('WiFi Name:')"></label>
                        <input
                            type="text"
                            x-model="config.wifiName"
                            @change="saveToLocalStorage()"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2" x-text="t('WiFi Password:')"></label>
                        <input
                            type="password"
                            x-model="config.wifiPassword"
                            @change="saveToLocalStorage()"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                </div>
            </div>

            <!-- Channel Names Card -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-semibold text-gray-800 mb-4" x-text="t('Channel Names')"></h2>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <template x-for="ch in 8" :key="ch">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2" x-text="t('Channel') + ' ' + ch + ':'"></label>
                            <input
                                type="text"
                                x-model="config.channelNames[ch - 1]"
                                @change="saveToLocalStorage()"
                                :placeholder="t('Channel') + ' ' + ch"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                    </template>
                </div>
            </div>

            <!-- Save Button -->
            <button
                @click="saveConfiguration()"
                class="w-full px-4 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors font-semibold"
                x-text="t('Save Configuration to Device')">
            </button>
        </div>
    </main>

    <script>
        // Register service worker for PWA functionality
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(registration => console.log('ServiceWorker registered'))
                .catch(error => console.log('ServiceWorker registration failed:', error));
        }
    </script>
    <!-- Load app.js module first, then load Alpine.js -->
    <script type="module">
        // First, import the app module to ensure appData is defined
        import('/js/app.js').then(() => {
            console.log('App module loaded, now loading Alpine.js...');

            // Now dynamically load Alpine.js
            const script = document.createElement('script');
            //script.src = 'https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js'; // loads from CDN too long causing race
            script.src = '/js/alpinejs-3.x.x.min.js';
            script.onload = () => {
                console.log('Alpine.js loaded and started');
            };
            document.head.appendChild(script);
        }).catch(error => {
            console.error('Failed to load app.js:', error);
        });
    </script>

</body>

</html>
